<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Stack of Cards Icon -->
  <g transform="translate(136, 120)">
    <!-- Back card -->
    <rect x="36" y="0" width="168" height="216" rx="20" fill="#27272a" stroke="#3f3f46" stroke-width="3" transform="rotate(8 120 108)"/>
    <!-- Middle card -->
    <rect x="18" y="14" width="168" height="216" rx="20" fill="#1f1f23" stroke="#52525b" stroke-width="3" transform="rotate(-6 102 122)"/>
    <!-- Front card -->
    <rect x="36" y="28" width="168" height="216" rx="20" fill="#121215" stroke="url(#cardGrad)" stroke-width="4"/>
    
    <!-- Stylized Sound/Brain Wave on Front Card -->
    <circle cx="120" cy="110" r="28" fill="#27272a"/>
    <path d="M106 110 Q120 90 134 110 T162 110" fill="none" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="190" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#e4e4e7" text-anchor="middle" letter-spacing="3">FSRS</text>
  </g>
</svg>
